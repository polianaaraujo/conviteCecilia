<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/scrollreveal"></script>
  
  <title>Cecília faz 15 — Confirme sua presença</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>
</head>

<body>
  <div class="card">
    <span class="card__ornament" aria-hidden="true"></span>

    <!-- Lado esquerdo: convite -->
    <section class="invite" aria-label="Convite">
      <img src="public/convite.png" alt="imagem do convite">
    </section>

    <!-- Lado direito: formulário -->
    <section class="rsvp">
      <p class="rsvp__eyebrow">Você é nosso convidado</p>
      <h1 class="rsvp__title">Confirme sua presença</h1>
      <div class="divider" aria-hidden="true"><span></span><i></i><span></span></div>
      <p class="rsvp__text">Será uma alegria celebrar esse momento tão especial com você. Confirme sua presença abaixo.
      </p>

      <form class="form" id="rsvp-form" action="#" method="post">
        <div class="field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required>
        </div>

        <div class="field">
          <label for="convidados">Número de pessoas</label>
          <div class="select">
            <select id="convidados" name="convidados">
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
            </select>
          </div>
          <small>Inclua você nessa quantidade.</small>
        </div>

        <div class="field">
          <label for="senha">Senha do convite</label>
          <input id="senha" name="senha" type="password" placeholder="Digite a senha recebida" required>
        </div>

        <button type="submit" class="btn">Confirmar presença</button>
      </form>

      <p class="rsvp__footer">06 · 11 · 26 — Cecília faz 15</p>
    </section>
  </div>
</body>

</html>
